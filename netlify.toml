[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"

[[redirects]]
  from = "https://zirar-focus.netlify.app/*"
  to = "https://zirar-focus.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tarifs"
  to = "/tarifs-photographe-avignon/"
  status = 301

[[redirects]]
  from = "/tarifs/"
  to = "/tarifs-photographe-avignon/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
